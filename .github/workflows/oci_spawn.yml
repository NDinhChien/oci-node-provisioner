name: Continuous OCI Python SDK Provisioner Loop
on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours — matches the ~5h50m job runtime
                              # below, so the next run starts right as the
                              # previous one wraps up instead of queuing
  workflow_dispatch:         # allows manual execution triggers

concurrency:
  group: oci-a1-provisioner
  cancel-in-progress: false  # never cancel a run that might be mid-retry

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # ~5h50m, safely under GitHub's 6-hour hard cap

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK Requirements
        run: pip install -r requirements.txt

      - name: Execute Python Provisioning Engine
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_GBS: ${{ secrets.OCI_MEMORY_GBS }}
        run: python "Ampere24ram4cpu/bot.py"